# Stages an npm release through Trusted Publishing (OIDC): no npm token is
# stored. The trusted publisher on npm only has the "stage publish" permission,
# so a maintainer must approve the staged version with 2FA before it goes live.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm stage` needs a newer npm than the one bundled with Node 24.
      - run: npm install -g npm@11.17.0

      - run: pnpm install --frozen-lockfile

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      # `prepublishOnly` runs lint, tests, typecheck, and build first.
      # Trusted Publishing adds provenance automatically.
      - run: npm stage publish

      - name: Show how to approve
        run: |
          {
            echo "Staged \`$(node -p "require('./package.json').name + '@' + require('./package.json').version")\`."
            echo "Approve it on npmjs.com, or run \`npm stage list\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
