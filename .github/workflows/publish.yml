# Publishes to npm through Trusted Publishing (OIDC): no npm token is stored.
# The npm package settings must list this repository and `publish.yml` as the
# trusted publisher.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Node 24 ships npm 11, which supports Trusted Publishing (npm >= 11.5.1).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      # `prepublishOnly` runs lint, tests, typecheck, and build first.
      # Trusted Publishing adds provenance automatically.
      - run: npm publish --access public
